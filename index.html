  var h='<h2>Капсула времени</h2><div class="sm">версия сайта 3</div><p class="sm">Загрузите фото и выберите дату. До этого дня остальные его не увидят, а потом оно откроется всем.</p><div class="card" style="margin-bottom:16px"><div class="form" style="flex-direction:column;align-items:stretch"><button class="btn soft" data-pickfile="1">'+(S.capImg?'Выбрать другое фото':'Выбрать фото')+'</button>'+(S.capMsg?'<div class="sm" style="color:var(--badi)">'+esc(S.capMsg)+'</div>':'')+(S.capImg?'<img src="'+S.capImg+'" style="width:100%;border-radius:12px">':'')+'<input id="capTxt" maxlength="120" placeholder="Подпись (по желанию)"><div class="sm">Когда показать всем?</div><input id="capDate" type="date" min="'+tom()+'"><button class="btn" data-savecap="1">Спрятать в капсулу</button></div></div>';
  h+=lk.map(function(x){return'<div class="card" style="margin-bottom:10px"><div class="row"><div><div class="time" style="font-size:19px">🔒 Откроется '+esc(nd(x.open))+'</div><div class="sm">Спрятал(а) '+esc(x.who)+'</div></div>'+(x.who===m?'<button class="btn link" data-delcap="'+x.id+'">×</button>':'')+'</div></div>'}).join("");
  h+=op.map(function(x){loadPh(x.id);var im=S.ph[x.id];return'<div class="card" style="margin-bottom:10px">'+(im?'<img src="'+im+'" style="width:100%;display:block">':'<div class="row sm">Загружаем фото…</div>')+'<div class="row"><div>'+(x.text?'<b>'+esc(x.text)+'</b>':'')+'<div class="sm">Спрятал(а) '+esc(x.who)+' · открылось '+esc(nd(x.open))+'</div></div>'+(x.who===m?'<button class="btn link" data-delcap="'+x.id+'">×</button>':'')+'</div></div>'}).join("");
  return h+(S.caps.length?'':'<p class="sm">Капсул пока нет.</p>')}
function vAns(){var mine=S.qa[me().name]||{};if(S.qi==null)S.qi=qNext(0);var i=S.qi;
  return'<h2>Ответить на вопросы</h2><p class="sm">Вопрос '+(i+1)+' из '+QS.length+(mine["q"+i]?' · вы уже ответили, можно изменить':'')+'</p><div class="card"><div style="padding:18px"><div class="time" style="font-size:20px;margin-bottom:12px">'+esc(QS[i])+'</div><textarea id="ansIn" rows="3" maxlength="200" placeholder="Ваш ответ">'+esc(mine["q"+i]||"")+'</textarea><p><button class="btn" style="width:100%" data-ans="save">Сохранить и дальше</button></p><div style="display:flex;justify-content:space-between"><button class="btn link" data-ans="prev">← Назад</button><button class="btn link" data-ans="next">Пропустить →</button></div></div></div>'}
function vQuiz(){var q=S.quiz,m=me().name;
  if(!q){var c=othersCount();return'<h2>Квиз</h2><div class="card"><div style="padding:18px"><p class="sm" style="margin-top:0">Вам покажут ответ кого-то из семьи, а вы угадаете, кто так ответил. Раунд из 10 вопросов.</p>'+(c?'<button class="btn" data-quiz="1">Начать ('+c+' ответов у семьи)</button>':'<p>Пока никто другой не ответил на вопросы. Попросите семью зайти в «Ответить на вопросы».</p>')+'</div></div>'}
  if(q.i>=q.p.length)return'<h2>Готово!</h2><div class="card"><div style="padding:18px"><div class="big">'+q.s+' из '+q.p.length+'</div><p class="sm">Вы угадали столько ответов.</p><button class="btn" data-qagain="1">Сыграть ещё</button></div></div>';
  var cur=q.p[q.i],opts=NAMES.filter(function(n){return n!==m});
  return'<div class="eyebrow">Вопрос '+(q.i+1)+' из '+q.p.length+'</div><h2>'+esc(QS[cur.q])+'</h2><div class="card" style="margin:12px 0"><div style="padding:18px;font-size:18px">«'+esc(cur.t)+'»</div></div><p class="sm">Кто так ответил?</p><div class="names" style="padding:0">'+opts.map(function(n){var st="";if(q.pick){if(n===cur.who)st=' style="background:var(--okbg)"';else if(n===q.pick)st=' style="background:var(--bad)"'}return'<button data-pick="'+n+'"'+st+'><span>'+n+'</span></button>'}).join("")+'</div>'+(q.pick?'<p><b>'+(q.pick===cur.who?'Верно!':'Не угадали. Это '+esc(cur.who)+'.')+'</b></p><button class="btn" data-qnext="1">Дальше</button>':'')}
function vQa(){var mine=S.qa[me().name]||{};
  if(S.qm==="answer")return'<p><button class="btn link" style="padding-left:0" data-qm="">← К квизу</button></p>'+vAns();
  if(S.qm==="quiz")return'<p><button class="btn link" style="padding-left:0" data-qm="">← К квизу</button></p>'+vQuiz();
  return'<h2>Семейный квиз</h2><p class="sm">Вы ответили на '+Object.keys(mine).length+' из '+QS.length+' вопросов. Чем больше ответов у семьи, тем интереснее квиз.</p><div class="card"><div class="row"><div><div class="time" style="font-size:19px">Ответить на вопросы</div><div class="sm">Отвечайте в своём темпе</div></div><button class="btn" data-qm="answer">Отвечать</button></div><div class="row"><div><div class="time" style="font-size:19px">Пройти квиз</div><div class="sm">Угадайте, кто так ответил</div></div><button class="btn" data-qm="quiz">Играть</button></div></div>'}
function vMore(){var back='<p><button class="btn link" style="padding-left:0" data-sub="">← Другое</button></p>';
  if(S.sub==="cap")return back+vCap();if(S.sub==="qa")return back+vQa();
  return'<h2>Другое</h2><p class="sm">Дополнительные разделы.</p><div class="card"><div class="row"><div><div class="time" style="font-size:19px">Капсула времени</div><div class="sm">Фото откроется всем в выбранный день</div></div><button class="btn" data-sub="cap">Открыть</button></div><div class="row"><div><div class="time" style="font-size:19px">Семейный квиз</div><div class="sm">Отвечайте и угадывайте ответы друг друга</div></div><button class="btn" data-sub="qa">Открыть</button></div></div>'}
function head(){var m=me();return'<div class="top"><div class="logo"><i>'+PAW.replace('width="30" height="30"','width="24" height="24"')+'</i><b>terry<span>.</span></b></div>'+(m?'<div class="chip">Вы: '+esc(m.name)+'</div>':'')+'</div>'}
function vGate(){
  if(!DB)return head()+'<div class="center"><h1>Осталось подключить базу</h1><p class="sm">Впишите адрес Firebase в файл config.js (см. README).</p></div>';if(err||!db)return head()+'<div class="center"><h1>Нет связи с дневником</h1><p class="sm">Проверьте интернет и обновите страницу.</p><button class="btn" onclick="location.reload()">Обновить</button></div>';
  if(!S.loaded.members)return head()+'<div class="center"><p class="sm">Загружаем…</p></div>';
  var taken=function(n){return S.members.some(function(m){return m.name===n})};
  return head()+'<div class="center"><div class="eyebrow">Один хвост. Четыре человека.</div><h1>Добро пожаловать в семью Terry</h1><p class="sm">Выберите себя один раз. После этого вы сможете отмечать кормления, прогулки и вес, а все остальные это увидят.</p><div class="card"><div class="names">'+
    NAMES.map(function(n){return'<button data-join="'+n+'"'+(taken(n)?' disabled':'')+'><span>'+n+'</span><span class="sm">'+(taken(n)?'уже занято':'это я →')+'</span></button>'}).join("")+'</div></div></div>';
}
function today(){return dstr(new Date())}
function vToday(){
  var t=today(),tf=S.feeds.filter(function(f){return f.date===t}),tw=S.walks.filter(function(f){return f.date===t}),ws=S.weights.slice().sort(function(a,b){return a.date<b.date?1:-1}),done=0;
  var rows=SLOTS.map(function(s){var f=tf.filter(function(x){return x.slot===s[0]})[0];if(f)done++;
    return'<div class="row'+(f?" done":"")+'"><div><div class="time">'+s[1]+' <span class="sm" style="font-weight:600">'+s[2]+'</span></div><div class="sm">'+(f?'✓ Покормил(а) '+esc(f.who)+' в '+esc(f.time):'Ещё не кормили')+'</div></div>'+(f?'<button class="btn link" data-del="feeds|'+f.id+'">Отменить</button>':'<button class="btn" data-feed="'+s[0]+'">Покормил(а)</button>')+'</div>'}).join("");
  var extra=tf.filter(function(x){return x.slot==="custom"}).sort(function(a,b){return a.ts-b.ts}).map(function(f){return'<div class="row done"><div><div class="time">'+esc(f.time)+'</div><div class="sm">✓ '+esc(f.who)+' · другое время</div></div><button class="btn link" data-del="feeds|'+f.id+'">Отменить</button></div>'}).join("");
  var last=S.feeds.slice().sort(function(a,b){return b.ts-a.ts})[0];
  return'<div class="grid two"><div><div class="eyebrow">Сегодня</div><h2>'+new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long"})+' <span class="tag" style="margin-left:6px">Кормили: '+(done+extra.split('class="row done"').length-1)+'</span></h2><p class="sm">Перед кормлением загляните сюда, чтобы не покормить Terry дважды.</p>'+
    '<div class="card">'+rows+extra+'<div class="row"><button class="btn soft" style="width:100%" data-feed="custom">+ Покормили в другое время (сейчас)</button></div></div>'+
    '<h2 style="margin-top:22px">Прогулки</h2><div class="card"><div class="row"><div><div class="time">'+tw.length+'</div><div class="sm">'+(tw.length?'Последняя в '+esc(tw[tw.length-1].time)+', '+esc(tw[tw.length-1].who):'Сегодня ещё не гуляли')+'</div></div><button class="btn" data-walk="1">Погуляли</button></div></div></div>'+
    '<div class="card hero"><span class="tag" style="align-self:flex-start">Наш любимый хвост</span><div class="paw">'+PAW.replace('width="30" height="30"','width="44" height="44"')+'</div><h2>Terry</h2><hr><div class="l"><span>Последний вес</span><b>'+(ws[0]?esc(ws[0].kg)+' кг':'— кг')+'</b></div><div class="l"><span>Последнее кормление</span><b>'+(last?esc(last.time)+', '+esc(last.who):'—')+'</b></div></div></div>';
}
function chart(ws){if(ws.length<2)return"";var a=ws.slice().sort(function(x,y){return x.date<y.date?-1:1}),W=480,H=150,pd=26,v=a.map(function(x){return x.kg}),mn=Math.min.apply(0,v),mx=Math.max.apply(0,v);if(mx===mn){mx+=1;mn-=1}
  var pts=a.map(function(x,i){return[pd+i*(W-2*pd)/(a.length-1),H-pd-(x.kg-mn)/(mx-mn)*(H-2*pd)]});
  return'<div class="card" style="padding:12px;margin-bottom:16px"><svg viewBox="0 0 '+W+' '+H+'"><polyline fill="none" stroke="var(--g)" stroke-width="3" stroke-linejoin="round" points="'+pts.map(function(p){return p.join(",")}).join(" ")+'"/>'+pts.map(function(p){return'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#7fa33a"/>'}).join("")+'<text x="2" y="12" font-size="12" fill="var(--mute)">'+mx.toFixed(1)+'</text><text x="2" y="'+(H-4)+'" font-size="12" fill="var(--mute)">'+mn.toFixed(1)+'</text></svg></div>'}
function vWeight(){var ws=S.weights.slice().sort(function(a,b){return a.date<b.date?1:-1});
  return'<h2>Вес Terry</h2><p class="sm">Взвесили Terry? Запишите дату и вес в кг.</p><div class="card" style="margin-bottom:16px"><div class="form"><input id="wd" type="date" value="'+today()+'"><input id="kg" type="text" inputmode="decimal" placeholder="кг"><button class="btn" data-savew="1">Записать</button></div></div>'+chart(ws)+
  '<div class="card">'+(ws.length?ws.map(function(w){return'<div class="li"><span><b>'+esc(w.kg)+' кг</b> · '+esc(nice(w.date))+'</span><span class="sm">'+esc(w.who)+' <button class="btn link" data-del="weights|'+w.id+'">×</button></span></div>'}).join(""):'<div class="li sm">Пока нет записей</div>')+'</div>'}
function vHist(){var by={},h="";S.feeds.forEach(function(f){(by[f.date]=by[f.date]||[]).push(f)});
  Object.keys(by).sort().reverse().slice(0,30).forEach(function(d){h+='<div class="day">'+esc(nice(d))+'</div><div class="card">'+by[d].sort(function(a,b){return a.time<b.time?-1:1}).map(function(f){return'<div class="li"><b>'+esc(f.time)+'</b><span class="sm">Кормил(а) '+esc(f.who)+'</span></div>'}).join("")+'</div>'});
  return'<h2>История кормлений</h2>'+(h||'<p class="sm">Появится после первого кормления.</p>')}
function vFam(){var m=me();return'<h2>Семья</h2><p class="sm">Кто уже вошёл в дневник.</p><div class="card">'+NAMES.map(function(n){var x=S.members.filter(function(k){return k.name===n})[0];return'<div class="li"><b>'+n+(m&&m.name===n?' (вы)':'')+'</b><span class="sm">'+(x?'✓ в семье':'ещё не вошёл(а)')+'</span></div>'}).join("")+'</div><h2 style="margin-top:22px">Напоминания</h2><p class="sm">Каждый день в 07:00, 12:00, 16:00 и 20:00 на этом телефоне. Приходят всегда, даже если уже покормили. Нужно сделать один раз на каждом телефоне.</p><p><button class="btn" data-ics="1">Добавить в календарь</button></p><p style="margin-top:16px"><button class="btn soft" data-leave="1">Это не я — выбрать другое имя</button></p>'}
function render(){var a=document.activeElement,keep=null,vals={},IDS=["shopIn","taskIn","capTxt","capDate","ansIn"];if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")){if(IDS.indexOf(a.id)>-1)keep={id:a.id,v:a.value};else return}else if(a&&a.tagName==="SELECT")return;IDS.slice(0,4).forEach(function(i){var e=$(i);if(e)vals[i]=e.value});var m=me();
  if(!db||err||!m){$("app").innerHTML=vGate();return}
  var nt=S.tasks.filter(function(x){return!x.done&&(!x.to||x.to==="all"||x.to===m.name)}).length,tabs=[["today","Сегодня"],["imp","Важное"+(nt?" ("+nt+")":"")],["weight","Вес"],["hist","История"],["more","Другое"],["fam","Семья"]];
  $("app").innerHTML=head()+'<h1>Забота о Terry</h1><div class="tabs">'+tabs.map(function(t){return'<button data-tab="'+t[0]+'"'+(t[0]===S.tab?' class="on"':'')+'>'+t[1]+'</button>'}).join("")+'</div>'+({today:vToday,imp:vImp,more:vMore,weight:vWeight,hist:vHist,fam:vFam}[S.tab])();Object.keys(vals).forEach(function(i){var e=$(i);if(e)e.value=vals[i]});if(keep){var e=$(keep.id);if(e){e.value=keep.v;e.focus()}}}
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.target.id==="shopIn"||e.target.id==="taskIn"))add(e.target.id==="shopIn"?"shop":"tasks")});
document.addEventListener("change",function(e){if(e.target.id==="taskTo")S.to=e.target.value;if(e.target.id==="capFile")pickImg(e.target.files[0])});
document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;var d=t.dataset;
  if(d.tab){S.tab=d.tab;if(d.tab==="more"){S.sub="";S.qm="";S.quiz=null}render()}else if(d.join)join(d.join);else if(d.feed)feed(d.feed);else if(d.walk)walk();else if(d.savew)saveW();
  else if(d.del){var p=d.del.split("|");del(p[0],p[1])}else if(d.ics)ics();else if(d.tog){var q=d.tog.split("|");tog(q[0],q[1],q[2]==="1")}else if(d.add)add(d.add);else if(d.sub!==undefined){S.sub=d.sub;S.qm="";S.quiz=null;render()}else if(d.qm!==undefined){S.qm=d.qm;S.quiz=null;render()}else if(d.pickfile)$("capFile").click();else if(d.savecap)saveCap();else if(d.delcap)delCap(d.delcap);else if(d.ans)ans(d.ans);else if(d.quiz)startQuiz();else if(d.pick){var qz=S.quiz;if(qz&&!qz.pick){qz.pick=d.pick;if(d.pick===qz.p[qz.i].who)qz.s++;render()}}else if(d.qnext){S.quiz.i++;S.quiz.pick=null;render()}else if(d.qagain){S.quiz=null;render()}else if(d.leave){var m=me();if(m)del("members",m.id)}});
var DB=(window.TERRY_DB_URL||"").replace(/\/$/,"");
function arr(o){o=o||{};return Object.keys(o).map(function(k){var x=o[k];x.id=k;return x})}
var PATHS=["feeds","weights","walks","members","shop","tasks","capsules","qa"];
function load(){return Promise.all(PATHS.map(function(p){return api("GET",p)})).then(function(r){var d={};PATHS.forEach(function(p,i){d[p]=r[i]});S.feeds=arr(d.feeds);S.weights=arr(d.weights);S.walks=arr(d.walks);S.members=arr(d.members);S.shop=arr(d.shop);S.tasks=arr(d.tasks);S.caps=arr(d.capsules);S.qa=d.qa||{};S.loaded.members=1;err=false;render()}).catch(function(){err=true;render()})}
try{myId=localStorage.getItem("terry-dev");if(!myId){myId="d"+Math.random().toString(36).slice(2)+Date.now();localStorage.setItem("terry-dev",myId)}}catch(e){myId="tmp"+Math.random()}
db=DB;render();
if(DB){load();setInterval(function(){if(!document.hidden)load()},5000)}
</script></body></html>
